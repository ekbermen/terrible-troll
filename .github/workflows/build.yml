kli_setup:
  # Ilk kez Kli'ye basinca veya Ayarlar > Kli API bolumunde gosterilir
  screen:
    title: "Kli'yi Etkinlestir"
    description: "Gemini API anahtarini yapistir. Anahtar sadece bu telefonda saklanir."
    fields:
      - id: gemini_api_key
        label: "Gemini API Anahtari"
        type: password
        paste_button: true
        show_hide_toggle: true
        placeholder: "AIza..."
        validate_regex: "^AIza[0-9A-Za-z_\\-]{20,}$"
    buttons:
      - { id: test, label: "Test Et", action: send_test_request }
      - { id: save, label: "Kaydet", action: save_to_secure_storage, primary: true }
      - { id: delete, label: "Anahtari Sil", action: delete_from_secure_storage, danger: true }
    help_link: "https://aistudio.google.com/apikey"
    help_text: "Ucretsiz anahtar almak icin Google AI Studio'yu ac."
  behavior:
    ask_on_first_kli_tap: true
    mask_key_in_ui: true
    never_log_key: true
    never_include_in_export: true
    never_include_in_project_files: true
  errors:
    missing_key: "Kli icin once API anahtari gir."
    invalid_key: "Anahtar gecersiz gorunuyor."
    quota_exceeded: "Kota doldu, biraz bekle."
    network: "Internet baglantisi yok."
