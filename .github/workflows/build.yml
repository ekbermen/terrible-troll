kli:
  display_name: Kli
  enabled: true
  provider: gemini
  model: gemini-2.5-flash
  # API anahtari dosyada ve APK'da YOK. Kullanici uygulamanin icine kendisi yazar.
  api_key:
    source: user_input
    storage: secure_storage      # flutter_secure_storage (Android Keystore)
    store_on_device_only: true
    required_for_kli: true
  endpoint: https://generativelanguage.googleapis.com/v1beta
  temperature: 0.7
  max_output_tokens: 1024
  timeout_seconds: 30
  language: auto   # kullanici hangi dilde yazarsa o dilde cevap
  personality: "Samimi, kisa konusan, enerjik bir kurgu arkadasi"
  confirm_before_apply: true   # degisiklik yapmadan once onay sor
  undo_after_apply: true
  system_prompt: |
    Sen Kli'sin, Klipix video editorunun yapay zeka asistanisin.
    Kullanici dogal dille bir sey isteyince bunu asagidaki 'actions' listesinden
    bir veya birkac eyleme cevirirsin ve SADECE JSON dondurursun.
    Format: {"reply": "kisa mesaj", "actions": [{"name": "...", "args": {...}}]}
    Bilmedigin bir eylem uydurma. Emin degilsen sor.
    Projeyi bozacak eylemlerden once reply icinde uyar.
    'Surpriz yap' denirse zevkli ama asiri olmayan 2-4 eylem sec.
    'Ne yakisir' denirse once oneri ver, uygulamadan onay bekle.
    Her zaman Turkce yaz, kullanici baska dil kullanirsa o dile gec.
  context_sent_to_model:
    project_summary: true      # klip sayisi, sureler, uygulanan efektler
    selected_clip: true
    video_frames: false        # varsayilan kapali, gizlilik icin
    thumbnails: true
  actions:
    - name: slow_motion
      description: "Secili klibi yavaslat"
      args:
        clip: "selected|id"
        speed: "0.1-1.0"
        smooth: "bool"
      reversible: true
    - name: fast_forward
      description: "Hizlandir"
      args:
        clip: "selected|id"
        speed: "1.0-100"
      reversible: true
    - name: add_transition
      description: "Iki klip arasina gecis ekle"
      args:
        between: "[clipA, clipB]"
        transition: "transition_id"
        duration_ms: "int"
      reversible: true
    - name: add_effect
      description: "Efekt ekle"
      args:
        clip: "selected|id"
        effect: "effect_id"
        intensity: "0-100"
      reversible: true
    - name: apply_filter
      description: "Filtre uygula"
      args:
        clip: "selected|id|all"
        filter: "filter_id"
        intensity: "0-100"
      reversible: true
    - name: add_text
      description: "Metin ekle"
      args:
        text: "string"
        start_ms: "int"
        duration_ms: "int"
        style: "style_id"
        animation: "anim_id"
      reversible: true
    - name: add_sticker
      description: "Cikartma ekle"
      args:
        sticker: "id"
        start_ms: "int"
        position: "[x,y]"
      reversible: true
    - name: cut_at
      description: "Belirli anda kes"
      args:
        at_ms: "int"
      reversible: true
    - name: trim
      description: "Kirp"
      args:
        clip: "id"
        start_ms: "int"
        end_ms: "int"
      reversible: true
    - name: delete_clip
      description: "Klibi sil"
      args:
        clip: "id"
      reversible: true
    - name: reverse
      description: "Ters cevir"
      args:
        clip: "selected|id"
      reversible: true
    - name: set_volume
      description: "Ses ayarla"
      args:
        clip: "id"
        volume: "0-200"
      reversible: true
    - name: auto_caption
      description: "Otomatik altyazi olustur"
      args:
        language: "tr|en|auto"
        style: "style_id"
      reversible: true
    - name: change_aspect
      description: "Oran degistir"
      args:
        ratio: "9:16|16:9|1:1|4:5|21:9"
      reversible: true
    - name: suggest
      description: "Oneri ver (uygulamaz)"
      args:
        topic: "filter|effect|transition|music|text"
        count: "int"
      reversible: true
    - name: surprise
      description: "Rastgele zevkli duzenleme"
      args:
        intensity: "low|medium|high"
        max_actions: "int"
      reversible: true
    - name: export
      description: "Disa aktar"
      args:
        preset: "preset_id"
      reversible: true
    - name: undo
      description: "Geri al"
      args: {}
      reversible: true
  quick_prompts:
    - "Slow motion ekle"
    - "Gecis ekle"
    - "Bu videoya ne yakisir?"
    - "Surpriz yap"
    - "Altyazi ekle"
    - "Daha sinematik yap"
    - "Daha enerjik yap"
    - "Sessiz kisimlari kes"
    - "Hepsini 9:16 yap"
    - "Muzige gore kes"
  examples:
    - { user: "kli slow motion ekle", action: slow_motion }
    - { user: "kli gecis ekle", action: add_transition }
    - { user: "kli ne yakisir", action: suggest }
    - { user: "kli surpriz yap", action: surprise }
    - { user: "kli altyazi ekle", action: auto_caption }
    - { user: "kli bunu ters cevir", action: reverse }
    - { user: "kli 9:16 yap", action: change_aspect }
    - { user: "kli disa aktar tiktok", action: export }
  safety:
    never_delete_project: true
    max_actions_per_request: 6
    rate_limit_per_minute: 15
    log_prompts_locally: false

