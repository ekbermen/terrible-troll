# =====================================================================
# KLIPIX - acik kaynak, reklamsiz, filigransiz video editoru (yapilandirma)
# Uygulama bu dosyayi okuyup arayuzu, araclari ve Kli yapay zekasini kurar.
# Motor: Flutter + ffmpeg_kit  |  Yapay zeka: Gemini (Kli)
# Bir ozelligi kapatmak icin: enabled: false
# =====================================================================

app:
  name: Klipix
  package: com.jjj.klipix
  version: 0.1.0
  build_number: 1
  min_android_sdk: 24
  target_android_sdk: 34
  ads: false
  watermark: false
  analytics: false
  account_required: false
  offline_first: true
  default_language: tr
  license: MIT
  repository: github.com/KULLANICI/klipix

theme:
  default_mode: dark
  radius: 12
  font: Inter
  modes:
    dark:
      background: "#0F0F10"
      surface: "#1A1A1C"
      surface_alt: "#242427"
      primary: "#f93838"
      primary_pressed: "#d92b2b"
      accent: "#ffb703"
      text: "#FFFFFF"
      text_muted: "#9E9E9E"
      divider: "#2E2E32"
      success: "#2ECC71"
      warning: "#F1C40F"
      danger: "#E74C3C"
      timeline_bg: "#141416"
      playhead: "#FFFFFF"
      clip_video: "#3A6EA5"
      clip_audio: "#2E8B57"
      clip_text: "#B8860B"
      clip_sticker: "#8E44AD"
    light:
      background: "#FAFAFA"
      surface: "#FFFFFF"
      surface_alt: "#F0F0F2"
      primary: "#f93838"
      primary_pressed: "#d92b2b"
      accent: "#fb8500"
      text: "#111111"
      text_muted: "#6B6B6B"
      divider: "#DDDDDD"
      success: "#27AE60"
      warning: "#E0A800"
      danger: "#C0392B"
      timeline_bg: "#EDEDEF"
      playhead: "#111111"
      clip_video: "#5B8DEF"
      clip_audio: "#3CB371"
      clip_text: "#DAA520"
      clip_sticker: "#A569BD"
  spacing: { xs: 4, sm: 8, md: 12, lg: 16, xl: 24 }
  animation: { fast_ms: 120, normal_ms: 220, slow_ms: 400, curve: easeInOut }

screens:
  home:
    top_bar: [logo, search, settings]
    sections: [new_project, recent_projects, templates, kli_suggestions]
    fab: { icon: add, label: Yeni Proje, color: primary }
  media_picker:
    tabs: [videos, photos, albums, stock_free]
    multi_select: true
    max_items: 100
    sort: [newest, oldest, duration]
  editor:
    top_bar: [back, project_name, undo, redo, export_button]
    preview: { aspect_ratios: ['9:16','16:9','1:1','4:5','21:9'], safe_area_guides: true, grid: true }
    timeline: { tracks: [video, overlay, audio, text, sticker, effect], zoom: true, snap: true, magnetic: true }
    bottom_toolbar: [cut, speed, text, audio, filter, effect, transition, sticker, crop, rotate, volume, kli]
  export:
    resolutions: [480, 720, 1080, 1440, 2160]
    fps: [24, 25, 30, 50, 60]
    format: [mp4, mov, gif, webm]
    show_estimated_size: true
    show_progress_notification: true
  settings:
    sections: [general, editor, export, kli_api, kli, storage, about]
    language_picker: true
    theme_picker: true
    clear_cache: true
  kli_chat:
    style: bottom_sheet
    quick_chips: [slow_motion, gecis_ekle, surpriz_yap, ne_yakisir, altyazi, muzik_oner]
    show_history: true
    voice_input: false

features:
  cut: { enabled: true, note: "Kes / bol / birlestir" }
  trim: { enabled: true, note: "Uc kirpma" }
  split: { enabled: true, note: "Playhead'den bol" }
  delete: { enabled: true, note: "Klibi sil" }
  duplicate: { enabled: true, note: "Klibi cogalt" }
  reorder: { enabled: true, note: "Surukle birak siralama" }
  speed: { enabled: true, note: "0.1x - 100x hiz" }
  speed_curve: { enabled: true, note: "Hiz egrisi" }
  reverse: { enabled: true, note: "Ters oynat" }
  freeze_frame: { enabled: true, note: "Kare dondur" }
  crop: { enabled: true, note: "Kirp" }
  rotate: { enabled: true, note: "Dondur" }
  flip: { enabled: true, note: "Aynala" }
  zoom_keyframes: { enabled: true, note: "Anahtar kare ile zoom" }
  opacity: { enabled: true, note: "Opaklik" }
  blend_modes: { enabled: true, note: "Karisim modlari" }
  volume: { enabled: true, note: "Ses seviyesi" }
  fade_audio: { enabled: true, note: "Ses yumusatma" }
  extract_audio: { enabled: true, note: "Videodan ses ayir" }
  voiceover: { enabled: true, note: "Seslendirme kaydi" }
  text: { enabled: true, note: "Metin" }
  stickers: { enabled: true, note: "Cikartma" }
  filters: { enabled: true, note: "Filtre" }
  effects: { enabled: true, note: "Efekt" }
  transitions: { enabled: true, note: "Gecis" }
  pip: { enabled: true, note: "Resim icinde resim" }
  green_screen: { enabled: true, note: "Chroma key" }
  stabilize: { enabled: true, note: "Titreme giderme" }
  auto_caption: { enabled: true, note: "Otomatik altyazi (Gemini)" }
  bg_remove: { enabled: false, note: "Arka plan silme (sonra eklenecek)" }
  cloud_sync: { enabled: false, note: "Bulut - kapali, sunucu yok" }
  templates: { enabled: true, note: "Sablonlar" }
  beat_sync: { enabled: false, note: "Ritme gore kes (deneysel)" }
  keyframes: { enabled: true, note: "Genel anahtar kareler" }
  masks: { enabled: true, note: "Maskeler" }
  grid_guides: { enabled: true, note: "Kilavuz cizgileri" }
  autosave: { enabled: true, note: "Otomatik kaydet" }
  undo_redo: { enabled: true, note: "Geri al / ileri al" }

